<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel · Apaixone-se Comigo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F7F5; --surface:#FFFFFF; --ink:#1F2124; --muted:#6C6A66; --line:#E3E0DA;
  --accent:#8F6A17; --accent-ink:#FFFFFF; --tile:#EFEDE8; --ok:#1B7F5A; --ok-bg:#E3F4EC; --bad:#B3261E; --bad-bg:#FBE9E7;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif; --body:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1D20; --surface:#25282C; --ink:#F3F0E8; --muted:#A5A29A; --line:#383B40;
  --accent:#D8B15A; --accent-ink:#1B1608; --tile:#2D3034; --ok:#5FD3A3; --ok-bg:#16332A; --bad:#FF9A92; --bad-bg:#3A1F1D; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px}
.wrap{max-width:900px;margin-inline:auto;padding-block:20px 60px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--display);letter-spacing:-.02em;margin:0}
h1{font-size:26px}h2{font-size:20px}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.login{max-width:380px;margin:12vh auto 0}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label,.lbl{font-size:13px;color:var(--muted)}
input,select,textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%;min-width:0}
input[type=color]{padding:2px;height:40px;width:52px;flex:none}
input[type=checkbox]{width:auto}
textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:560px){.two,.three{grid-template-columns:1fr}}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 18px;font-weight:600}
.btn.line{background:none;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.msg{padding:10px 12px;border-radius:10px;font-size:14px}
.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.bad{background:var(--bad-bg);color:var(--bad)}
.prow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .th{width:64px;height:64px;border-radius:10px;background:var(--tile);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:11px}
.prow .th img{width:100%;height:100%;object-fit:cover}
.prow h3{margin:0;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);margin-left:6px}
.chip.on{background:var(--ok-bg);color:var(--ok);border-color:transparent}
@media(max-width:620px){.prow{grid-template-columns:56px 1fr}.prow .actions{grid-column:1/-1}.prow .th{width:56px;height:56px}}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.ph{position:relative;width:96px}
.ph img{width:96px;height:96px;object-fit:cover;border-radius:10px;display:block;border:1px solid var(--line)}
.ph .acts{display:flex;gap:4px;margin-top:4px}
.ph .acts button{flex:1;font-size:11px;padding:3px 0;border:1px solid var(--line);background:var(--surface);border-radius:6px}
.ph .main{position:absolute;top:4px;left:4px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px}
.crow{display:flex;gap:8px;align-items:center}
details.ord{border-bottom:1px solid var(--line);padding-block:10px}
details.ord summary{cursor:pointer;overflow-wrap:anywhere}
.ordbody{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.ordbody a{color:var(--accent)}
.setup{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:16px;max-width:560px;margin:10vh auto}
</style>
</head>
<body>
<div class="wrap" id="root"><p class="muted">Carregando…</p></div>
<script src="firebase-config.js"></script>
<script type="module">
const V="10.12.2",G="https://www.gstatic.com/firebasejs/"+V+"/";
const root=document.getElementById("root");
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const cfg=window.FIREBASE_CONFIG||{};
if(!cfg.apiKey||String(cfg.apiKey).indexOf("COLE")===0){
  root.innerHTML='<div class="setup"><h2>Falta configurar o Firebase</h2><p>Abra o arquivo <b>firebase-config.js</b> e cole as chaves do seu projeto. O passo a passo está em COMO-CONFIGURAR.md.</p></div>';
} else { start(); }

async function start(){
  const [A,AU,FS]=await Promise.all([import(G+"firebase-app.js"),import(G+"firebase-auth.js"),import(G+"firebase-firestore.js")]);
  const app=A.initializeApp(cfg),auth=AU.getAuth(app),db=FS.getFirestore(app);
  const CATS=["Tote","Transversal","Bucket","Clutch","Mochila"];
  const TAGS=["","Novo","Oferta","Mais vendida","Últimas unidades"];
  const STATUSES=["Aguardando pagamento","Pagamento confirmado","Em separação","Enviado","Entregue","Cancelado"];
  const S={orders:[],ordersErr:false,openOrder:null,user:null,tab:"produtos",products:[],loaded:false,form:null,msg:null,confirmDel:null,settings:{freeFrom:199,shipping:19.9,pixOff:5,installments:10,whatsapp:""}};

  AU.onAuthStateChanged(auth,async u=>{S.user=u;if(u){await loadAll();await loadOrders()}render()});

  async function loadAll(){
    try{
      const snap=await FS.getDocs(FS.collection(db,"produtos"));
      S.products=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      const c=await FS.getDoc(FS.doc(db,"config","loja"));
      if(c.exists()){const d=c.data();S.settings={freeFrom:d.freeFrom??199,shipping:d.shipping??19.9,pixOff:Math.round((d.pixOff??0.05)*100),installments:d.installments??10,whatsapp:d.whatsapp||""}}
      S.loaded=true;
    }catch(e){S.msg={t:"bad",x:"Não consegui carregar os dados. Confira as regras do Firestore. ("+esc(e.code||e.message)+")"}}
  }

  async function loadOrders(){
    try{
      const snap=await FS.getDocs(FS.collection(db,"pedidos"));
      S.orders=snap.docs.map(d=>({...d.data(),code:d.id})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));S.ordersErr=false;
    }catch(e){S.ordersErr=true}
  }
  const newCount=()=>S.orders.filter(o=>o.status==="Aguardando pagamento").length;
  const trackLink=code=>new URL("index.html",location.href).href+"?pedido="+encodeURIComponent(code);
  const fmtCode=c=>String(c).slice(0,5)+"-"+String(c).slice(5);
  const waNum=t=>{const d=String(t||"").replace(/\D/g,"");return d.length>=12?d:"55"+d};

  function render(){
    if(!S.user){return renderLogin()}
    let h='<div class="top"><div><h1>Painel da loja</h1><span class="muted">'+esc(S.user.email)+'</span></div><div class="actions"><a class="btn line sm" href="index.html" style="text-decoration:none;display:inline-block">Ver a loja</a><button class="btn line sm" id="out">Sair</button></div></div>';
    h+='<div class="tabs"><button class="tab" data-tab="produtos" aria-pressed="'+(S.tab==="produtos")+'">Produtos</button><button class="tab" data-tab="pedidos" aria-pressed="'+(S.tab==="pedidos")+'">Pedidos'+(newCount()?' ('+newCount()+' novos)':'')+'</button><button class="tab" data-tab="config" aria-pressed="'+(S.tab==="config")+'">Configurações</button></div>';
    if(S.msg)h+='<div class="msg '+S.msg.t+'" role="status" style="margin-bottom:12px">'+S.msg.x+'</div>';
    h+=S.tab==="config"?settingsHtml():S.tab==="pedidos"?ordersHtml():(S.form?formHtml():listHtml());
    root.innerHTML=h;bind();
    if(S.form){renderPhotos();renderColors()}
  }

  function renderLogin(){
    root.innerHTML='<form class="panel login" id="lf"><h1>Entrar</h1><p class="muted" style="margin:0">Painel da loja Apaixone-se Comigo. Acesso só da administradora.</p>'+
     (S.msg?'<div class="msg '+S.msg.t+'">'+S.msg.x+'</div>':'')+
     '<div class="f"><label for="em">E-mail</label><input id="em" type="email" required autocomplete="username"></div>'+
     '<div class="f"><label for="pw">Senha</label><input id="pw" type="password" required autocomplete="current-password"></div>'+
     '<button class="btn" type="submit">Entrar</button><button class="btn line sm" type="button" id="forgot">Esqueci a senha</button></form>';
    document.getElementById("lf").onsubmit=async e=>{e.preventDefault();S.msg=null;
      try{await AU.signInWithEmailAndPassword(auth,document.getElementById("em").value.trim(),document.getElementById("pw").value)}
      catch(err){S.msg={t:"bad",x:"E-mail ou senha incorretos."};renderLogin()}};
    document.getElementById("forgot").onclick=async()=>{const em=document.getElementById("em").value.trim();
      if(!em){S.msg={t:"bad",x:"Digite seu e-mail no campo acima e toque de novo."};return renderLogin()}
      try{await AU.sendPasswordResetEmail(auth,em);S.msg={t:"ok",x:"Enviamos um link para redefinir a senha, se o e-mail estiver cadastrado."}}catch(e){S.msg={t:"bad",x:"Não foi possível enviar agora."}}renderLogin()};
  }

  function listHtml(){
    let h='<div class="panel"><div class="top" style="margin:0"><h2>Bolsas ('+S.products.length+')</h2><button class="btn" id="new">Nova bolsa</button></div>';
    if(!S.loaded)h+='<p class="muted">Carregando…</p>';
    else if(!S.products.length)h+='<p class="muted">Nenhuma bolsa cadastrada ainda. Toque em "Nova bolsa" para começar.</p>';
    S.products.forEach(p=>{
      const on=p.active!==false,th=(p.photos&&p.photos[0])?'<img src="'+p.photos[0]+'" alt="">':'sem foto';
      h+='<div class="prow"><div class="th">'+th+'</div><div style="min-width:0"><h3>'+esc(p.name)+'<span class="chip '+(on?'on':'')+'">'+(on?'Visível':'Oculta')+'</span></h3><div class="muted">'+esc(p.cat)+' · '+brl(p.price)+(p.old?' (de '+brl(p.old)+')':'')+'</div></div>'+
       '<div class="actions"><button class="btn line sm" data-edit="'+p.id+'">Editar</button><button class="btn line sm" data-toggle="'+p.id+'">'+(on?'Ocultar':'Mostrar')+'</button>'+
       (S.confirmDel===p.id?'<button class="btn bad sm" data-del="'+p.id+'">Confirmar exclusão</button><button class="btn line sm" data-cancel>Cancelar</button>':'<button class="btn line sm" data-ask="'+p.id+'">Excluir</button>')+'</div></div>';
    });
    return h+'</div>';
  }

  function formHtml(){
    const f=S.form,p=f.data;
    return '<form class="panel" id="pf"><h2>'+(f.id?'Editar bolsa':'Nova bolsa')+'</h2>'+
     '<div class="f"><label for="n">Nome</label><input id="n" required maxlength="80" value="'+esc(p.name)+'"></div>'+
     '<div class="two"><div class="f"><label for="c">Categoria</label><input id="c" required list="cl" maxlength="30" value="'+esc(p.cat)+'"><datalist id="cl">'+[...new Set(CATS.concat(S.products.map(x=>x.cat)))].map(c=>'<option value="'+esc(c)+'">').join("")+'</datalist></div>'+
     '<div class="f"><label for="t">Selo</label><select id="t">'+TAGS.map(t=>'<option value="'+esc(t)+'"'+(t===p.tag?' selected':'')+'>'+(t||'Nenhum')+'</option>').join("")+'</select></div></div>'+
     '<div class="two"><div class="f"><label for="pr">Preço (R$)</label><input id="pr" type="number" step="0.01" min="0.01" required value="'+(p.price||"")+'"></div>'+
     '<div class="f"><label for="po">Preço antigo, se estiver em oferta (R$)</label><input id="po" type="number" step="0.01" min="0" value="'+(p.old||"")+'"></div></div>'+
     '<div class="f"><label for="d">Descrição</label><textarea id="d" maxlength="600">'+esc(p.desc)+'</textarea></div>'+
     '<div><div class="lbl">Fotos (até 4; a primeira é a principal)</div><div class="photos" id="photos" style="margin-top:6px"></div></div>'+
     '<div><div class="lbl">Cores disponíveis</div><div id="colors" style="margin-top:6px;display:flex;flex-direction:column;gap:8px"></div><button type="button" class="btn line sm" id="addcolor" style="margin-top:8px;align-self:flex-start">Adicionar cor</button></div>'+
     '<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="a"'+(p.active!==false?' checked':'')+'> Visível na loja</label>'+
     '<div class="actions"><button class="btn" type="submit" id="save">Salvar</button><button class="btn line" type="button" id="cancel">Cancelar</button></div></form>';
  }

  function renderPhotos(){
    const f=S.form,box=document.getElementById("photos");
    box.innerHTML=f.data.photos.map((u,i)=>'<div class="ph">'+(i===0?'<span class="main">Principal</span>':'')+'<img src="'+u+'" alt="Foto '+(i+1)+'"><div class="acts">'+(i>0?'<button type="button" data-first="'+i+'">Principal</button>':'')+'<button type="button" data-rm="'+i+'">Remover</button></div></div>').join("")+
     (f.data.photos.length<4?'<label class="btn line sm" style="align-self:center;cursor:pointer">Adicionar foto<input id="file" type="file" accept="image/*" multiple hidden></label>':'');
    box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{f.data.photos.splice(+b.dataset.rm,1);renderPhotos()});
    box.querySelectorAll("[data-first]").forEach(b=>b.onclick=()=>{const i=+b.dataset.first,[x]=f.data.photos.splice(i,1);f.data.photos.unshift(x);renderPhotos()});
    const inp=document.getElementById("file");
    if(inp)inp.onchange=async()=>{
      for(const file of [...inp.files]){if(f.data.photos.length>=4)break;
        try{f.data.photos.push(await shrink(file))}catch(e){S.msg={t:"bad",x:"Não consegui ler uma das fotos."}}}
      renderPhotos()};
  }
  async function shrink(file){
    const bmp=await createImageBitmap(file),max=800,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return c.toDataURL("image/jpeg",0.72);
  }
  function renderColors(){
    const f=S.form,box=document.getElementById("colors");
    box.innerHTML=f.data.colors.map((k,i)=>'<div class="crow"><input type="color" data-ch="'+i+'" value="'+esc(k.hex)+'" aria-label="Cor"><input data-cn="'+i+'" value="'+esc(k.name)+'" maxlength="30" placeholder="Nome da cor" aria-label="Nome da cor"><button type="button" class="btn line sm" data-crm="'+i+'"'+(f.data.colors.length<2?' disabled':'')+'>Remover</button></div>').join("");
    box.querySelectorAll("[data-ch]").forEach(i=>i.oninput=()=>f.data.colors[+i.dataset.ch].hex=i.value);
    box.querySelectorAll("[data-cn]").forEach(i=>i.oninput=()=>f.data.colors[+i.dataset.cn].name=i.value);
    box.querySelectorAll("[data-crm]").forEach(b=>b.onclick=()=>{f.data.colors.splice(+b.dataset.crm,1);renderColors()});
  }

  function ordersHtml(){
    let h='<div class="panel"><div class="top" style="margin:0"><h2>Pedidos ('+S.orders.length+')</h2><button class="btn line sm" id="reload">Atualizar</button></div>';
    if(S.ordersErr)h+='<div class="msg bad">Não consegui carregar os pedidos. Confira se as regras novas do Firestore foram publicadas (veja COMO-CONFIGURAR.md).</div>';
    else if(!S.orders.length)h+='<p class="muted">Nenhum pedido ainda. Quando um cliente finalizar a compra na loja, ele aparece aqui.</p>';
    S.orders.forEach((o,i)=>{
      const c=o.customer||{},a=o.address||{},it=o.items||[],link=trackLink(o.code);
      const date=o.createdAt?new Date(o.createdAt).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"";
      const msg=encodeURIComponent("Olá, "+(String(c.name||"").split(" ")[0])+"! Seu pedido "+fmtCode(o.code)+" está: "+(o.status||"")+(o.rastreio?" (rastreio: "+o.rastreio+")":"")+". Acompanhe: "+link);
      h+='<details class="ord"'+(S.openOrder===o.code?' open':'')+' data-code="'+esc(o.code)+'"><summary><b>'+esc(fmtCode(o.code))+'</b> · '+esc(date)+' · '+esc(c.name)+' · '+brl(o.total)+' <span class="chip '+(o.status==="Aguardando pagamento"?'':'on')+'">'+esc(o.status)+'</span></summary>'+
       '<div class="ordbody"><div><b>Cliente</b><br>'+esc(c.name)+'<br>WhatsApp: '+esc(c.tel)+' · <a href="https://wa.me/'+esc(waNum(c.tel))+'?text='+msg+'" target="_blank" rel="noopener">Enviar mensagem</a><br>E-mail: '+esc(c.mail)+'</div>'+
       '<div><b>Entrega</b><br>'+esc(a.rua)+', '+esc(a.num)+'<br>'+esc(a.cid)+' - '+esc(a.uf)+' · CEP '+esc(a.cep)+'</div>'+
       '<div><b>Itens</b>'+it.map(x=>'<div>'+esc(x.qty)+'× '+esc(x.name)+' <span class="muted">('+esc(x.color)+')</span> · '+brl(x.price*x.qty)+'</div>').join("")+
       '<div class="muted" style="margin-top:6px">Subtotal '+brl(o.subtotal)+' · Frete '+brl(o.ship)+(o.disc?' · Desconto Pix −'+brl(o.disc):'')+'</div><div><b>Total '+brl(o.total)+'</b> · '+(o.pay==="pix"?"Pix":"Cartão")+'</div></div>'+
       '<div class="two"><div class="f"><label for="os'+i+'">Status</label><select id="os'+i+'">'+STATUSES.map(t=>'<option'+(t===o.status?' selected':'')+'>'+t+'</option>').join("")+'</select></div>'+
       '<div class="f"><label for="or'+i+'">Código de rastreio</label><input id="or'+i+'" maxlength="40" value="'+esc(o.rastreio||"")+'"></div></div>'+
       '<div class="f"><label>Link de acompanhamento do cliente</label><input readonly value="'+esc(link)+'" onfocus="this.select()"></div>'+
       '<div class="actions"><button class="btn sm" data-saveord="'+i+'">Salvar pedido</button></div></div></details>';
    });
    return h+'</div>';
  }
  async function saveOrder(i){
    const o=S.orders[i],status=document.getElementById("os"+i).value,rastreio=document.getElementById("or"+i).value.trim();
    try{
      await FS.setDoc(FS.doc(db,"pedidos",o.code),{status,rastreio},{merge:true});
      await FS.setDoc(FS.doc(db,"acompanhamento",o.code),{status,rastreio},{merge:true});
      o.status=status;o.rastreio=rastreio;S.openOrder=o.code;S.msg={t:"ok",x:"Pedido "+esc(fmtCode(o.code))+" atualizado. O cliente já vê o novo status."};
    }catch(e){S.msg={t:"bad",x:"Não foi possível atualizar o pedido ("+esc(e.code||e.message)+")."}}
    render();
  }

  function settingsHtml(){
    const s=S.settings;
    return '<form class="panel" id="sf"><h2>Configurações da loja</h2>'+
     '<div class="three"><div class="f"><label for="s1">Frete grátis acima de (R$)</label><input id="s1" type="number" step="0.01" min="0" value="'+s.freeFrom+'"></div>'+
     '<div class="f"><label for="s2">Valor do frete (R$)</label><input id="s2" type="number" step="0.01" min="0" value="'+s.shipping+'"></div>'+
     '<div class="f"><label for="s3">Desconto no Pix (%)</label><input id="s3" type="number" step="1" min="0" max="50" value="'+s.pixOff+'"></div></div>'+
     '<div class="two"><div class="f"><label for="s4">Parcelas sem juros</label><input id="s4" type="number" step="1" min="1" max="12" value="'+s.installments+'"></div>'+
     '<div class="f"><label for="s5">WhatsApp da loja (só números, com 55 e DDD)</label><input id="s5" inputmode="numeric" placeholder="5511912345678" value="'+esc(s.whatsapp)+'"></div></div>'+
     '<div class="actions"><button class="btn" type="submit">Salvar configurações</button></div></form>';
  }

  function blank(){return {name:"",cat:"",tag:"",price:"",old:"",desc:"",photos:[],colors:[{name:"Único",hex:"#B9763C"}],active:true}}
  function bind(){
    const q=s=>root.querySelectorAll(s),one=s=>root.querySelector(s);
    const out=one("#out");if(out)out.onclick=()=>AU.signOut(auth);
    q("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.form=null;S.msg=null;render()});
    const nw=one("#new");if(nw)nw.onclick=()=>{S.form={id:null,data:blank()};S.msg=null;render();window.scrollTo(0,0)};
    q("[data-edit]").forEach(b=>b.onclick=()=>{const p=S.products.find(x=>x.id===b.dataset.edit);
      S.form={id:p.id,data:{name:p.name||"",cat:p.cat||"",tag:p.tag||"",price:p.price||"",old:p.old||"",desc:p.desc||"",photos:[...(p.photos||[])],colors:(p.colors&&p.colors.length?p.colors:[{name:"Único",hex:"#B9763C"}]).map(k=>Array.isArray(k)?{name:k[0],hex:k[1]}:{...k}),active:p.active!==false}};S.msg=null;render();window.scrollTo(0,0)});
    q("[data-toggle]").forEach(b=>b.onclick=async()=>{const p=S.products.find(x=>x.id===b.dataset.toggle);
      try{await FS.setDoc(FS.doc(db,"produtos",p.id),{active:p.active===false},{merge:true});p.active=p.active===false;S.msg=null}catch(e){S.msg={t:"bad",x:"Não foi possível alterar. Confira se está logada com a conta certa."}}render()});
    q("[data-ask]").forEach(b=>b.onclick=()=>{S.confirmDel=b.dataset.ask;render()});
    q("[data-cancel]").forEach(b=>b.onclick=()=>{S.confirmDel=null;render()});
    q("[data-del]").forEach(b=>b.onclick=async()=>{try{await FS.deleteDoc(FS.doc(db,"produtos",b.dataset.del));S.products=S.products.filter(x=>x.id!==b.dataset.del);S.msg={t:"ok",x:"Bolsa excluída."}}catch(e){S.msg={t:"bad",x:"Não foi possível excluir."}}S.confirmDel=null;render()});
    const rl=one("#reload");if(rl)rl.onclick=async()=>{await loadOrders();S.msg=null;render()};
    q("[data-saveord]").forEach(b=>b.onclick=()=>saveOrder(+b.dataset.saveord));
    const ac=one("#addcolor");if(ac)ac.onclick=()=>{S.form.data.colors.push({name:"",hex:"#26222B"});renderColors()};
    const cn=one("#cancel");if(cn)cn.onclick=()=>{S.form=null;render()};
    const pf=one("#pf");if(pf)pf.onsubmit=async e=>{e.preventDefault();await saveProduct()};
    const sf=one("#sf");if(sf)sf.onsubmit=async e=>{e.preventDefault();await saveSettings()};
  }

  async function saveProduct(){
    const f=S.form,d=f.data,v=id=>document.getElementById(id).value.trim();
    const price=parseFloat(v("pr")),old=parseFloat(v("po"))||0;
    if(!(price>0)){S.msg={t:"bad",x:"Informe um preço válido."};return render2()}
    if(old&&old<=price){S.msg={t:"bad",x:"O preço antigo precisa ser maior que o preço atual."};return render2()}
    const size=d.photos.reduce((n,u)=>n+u.length,0);
    if(size>850000){S.msg={t:"bad",x:"As fotos juntas estão pesadas. Remova uma foto e tente de novo."};return render2()}
    const colors=d.colors.map(k=>({name:(k.name||"").trim()||"Único",hex:k.hex||"#999999"}));
    const data={name:v("n"),cat:v("c"),tag:v("t"),price:price,old:old||null,desc:v("d"),photos:d.photos,colors:colors,active:document.getElementById("a").checked};
    const btn=document.getElementById("save");btn.disabled=true;btn.textContent="Salvando…";
    try{
      if(f.id){await FS.setDoc(FS.doc(db,"produtos",f.id),data,{merge:true})}
      else{data.createdAt=Date.now();await FS.addDoc(FS.collection(db,"produtos"),data)}
      S.form=null;S.msg={t:"ok",x:"Bolsa salva. Já aparece na loja."};await loadAll();render();window.scrollTo(0,0);
    }catch(e){S.msg={t:"bad",x:"Não foi possível salvar ("+esc(e.code||e.message)+"). Confira as regras do Firestore e se você entrou com a conta administradora."};render2()}
  }
  function render2(){ // mostra aviso sem perder o que foi digitado
    const old=document.querySelector(".msg");if(old)old.remove();
    const m=document.createElement("div");m.className="msg "+S.msg.t;m.setAttribute("role","status");m.style.marginBottom="12px";m.innerHTML=S.msg.x;
    document.getElementById("pf").before(m);m.scrollIntoView({block:"center"});
    const b=document.getElementById("save");if(b){b.disabled=false;b.textContent="Salvar"}
  }
  async function saveSettings(){
    const n=id=>parseFloat(document.getElementById(id).value)||0;
    const data={freeFrom:n("s1"),shipping:n("s2"),pixOff:Math.min(50,Math.max(0,n("s3")))/100,installments:Math.min(12,Math.max(1,Math.round(n("s4")))),whatsapp:document.getElementById("s5").value.replace(/\D/g,"")};
    try{await FS.setDoc(FS.doc(db,"config","loja"),data);S.settings={...data,pixOff:Math.round(data.pixOff*100)};S.msg={t:"ok",x:"Configurações salvas."}}
    catch(e){S.msg={t:"bad",x:"Não foi possível salvar as configurações."}}render();
  }
}
</script>
</body>
</html>
